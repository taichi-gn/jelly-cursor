name: Screenshots

on:
  push:
  workflow_dispatch:

jobs:
  # macOS の実行時間を使うので、手で動かしたときか、コミットメッセージに [screenshots] があるときだけ撮る
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: make app
      - run: .github/scripts/screenshots.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
